name: Publikacja GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Pobranie kodu
        uses: actions/checkout@v4

      - name: Instalacja Fluttera
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Konfiguracja GitHub Pages
        uses: actions/configure-pages@v5

      - name: Pobranie zależności
        run: flutter pub get

      - name: Testy
        run: flutter test

      - name: Budowanie aplikacji
        run: flutter build web --release --base-href "/MeteoSzybkaPogoda/"

      - name: Przygotowanie plików Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publikacja
        id: deployment
        uses: actions/deploy-pages@v4
